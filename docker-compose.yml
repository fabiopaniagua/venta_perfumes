version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: perfumeria_fabio_db
    restart: always
    environment:
      POSTGRES_USER: fabio_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: perfumeria_fabio
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - perfumeria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabio_user -d perfumeria_fabio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perfumeria_fabio_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fabio_user}:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en el archivo .env}@postgres:5432/${POSTGRES_DB:-perfumeria_fabio}?schema=public
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5001:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - perfumeria-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: perfumeria_fabio_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5001/api
    ports:
      - "5174:5173"
    networks:
      - perfumeria-network

volumes:
  pgdata:

networks:
  perfumeria-network:
    driver: bridge

